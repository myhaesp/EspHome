text_sensor:
  - platform: template
    name: "Appliance Date & Time"
    id: genvex_datetime
    update_interval: never
    lambda: |-
      if (isnan(id(genvex_clock_date).state) ||
          isnan(id(genvex_clock_month).state) ||
          isnan(id(genvex_clock_year).state) ||
          isnan(id(genvex_clock_hour).state) ||
          isnan(id(genvex_clock_minute).state) ||
          isnan(id(genvex_clock_day).state)) {
        return {"Unknown"};
      }

      const char *day_name;

      switch ((int) id(genvex_clock_day).state) {
        case 1: day_name = "Monday";  break;
        case 2: day_name = "Tuesday"; break;
        case 3: day_name = "Wednesday";  break;
        case 4: day_name = "Thursday"; break;
        case 5: day_name = "Friday";  break;
        case 6: day_name = "Saturday";  break;
        case 7: day_name = "Sunday";  break;
        default: day_name = "Unknown"; break;
      }

      char buffer[40];

      snprintf(buffer, sizeof(buffer),
               "%s %02d/%02d/%04d %02d:%02d",
               day_name,
               (int) id(genvex_clock_date).state,
               (int) id(genvex_clock_month).state,
               2000 + (int) id(genvex_clock_year).state,
               (int) id(genvex_clock_hour).state,
               (int) id(genvex_clock_minute).state);

      return {buffer};

  - platform: template
    name: "Genvex Air Quality Index Humidity (AQI)"
    id: aqi_humidity
    icon: mdi:water-percent 

  - platform: modbus_controller
    modbus_controller_id: genvex_modbus_controller
    name: "Genvex Alarm"
    id: genvex_alarm
    register_type: read
    address: 101
    lambda: !lambda |-
      uint16_t int_mode = (data[item->offset] << 8) + data[item->offset+1];
      ESP_LOGD("main","Parsed operation mode int : %d", int_mode);
      std::string mode_str;
      switch (int_mode) {
        case 0:  mode_str = "Off"; break;
        case 1:  mode_str = "External Stop"; break;
        case 2:  mode_str = "Main Filter"; break;
        case 3:  mode_str = "External Stop & Main Filter"; break;
        case 4:  mode_str = "High Pressure"; break;
        case 5:  mode_str = "High Pressure & External Stop"; break;
        case 6:  mode_str = "High Pressure & Main Filter"; break;
        case 7:  mode_str = "High Pressure & External Stop & Main Filter"; break;
        case 8:  mode_str = "Frost"; break;
        case 9:  mode_str = "Frost & External Stop"; break;
        case 10: mode_str = "Frost & Main Filter"; break;
        case 11: mode_str = "Frost & External Stop & Main Filter"; break;
        case 12: mode_str = "Frost & High Pressure"; break;
        case 13: mode_str = "Frost & High Pressure & External Stop"; break;
