substitutions:
  name: modbus-gateway
  friendly_name: "Modbus Gateway - Genvex"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

esp32:
  variant: esp32
  framework:
    type: esp-idf
      
# Enable logging
logger:
#  level: DEBUG
  logs:
    ledc.output: NONE


# Enable Home Assistant API
api:
  encryption:
    key: !secret Shared_HA_Key

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO14

status_led:
  pin: GPIO15

output:
  - platform: ledc
    pin: GPIO2
    id: gpio_2

# Example usage in a light
light:
  - platform: monochromatic
    output: gpio_2
    name: "network Light"

interval:
  - interval: 1s
    then:
      if:
        condition:
          api.connected 
        then:
          - output.turn_on: gpio_2
          - output.ledc.set_frequency:
              id: gpio_2
              frequency: "1000Hz"
          - output.set_level:
              id: gpio_2
              level: "80%"    
        else:
          - output.turn_off: gpio_2    

  - interval: 5min
    then:
      - lambda: |-
          auto now = id(sntp_time).now();

          if (!now.is_valid()) {
            ESP_LOGW("genvex_clock", "System time not valid - skipping clock check");
            return;
          }

          // Make sure all Genvex clock registers have valid values
          if (isnan(id(genvex_clock_hour).state) ||
              isnan(id(genvex_clock_minute).state) ||
              isnan(id(genvex_clock_day).state) ||
              isnan(id(genvex_clock_date).state) ||
              isnan(id(genvex_clock_month).state) ||
              isnan(id(genvex_clock_year).state)) {
            ESP_LOGW("genvex_clock", "Genvex clock values not available - skipping clock check");
            return;
          }

          int genvex_hour   = (int) id(genvex_clock_hour).state;
          int genvex_minute = (int) id(genvex_clock_minute).state;
          int genvex_day    = (int) id(genvex_clock_day).state;
          int genvex_date   = (int) id(genvex_clock_date).state;
          int genvex_month  = (int) id(genvex_clock_month).state;
          int genvex_year   = 2000 + (int) id(genvex_clock_year).state;

          // ESPHome: Sunday=1 ... Saturday=7
          // Genvex:   Monday=1 ... Sunday=7
          int expected_day =
              now.day_of_week == 1 ? 7 : now.day_of_week - 1;

          bool date_mismatch =
              genvex_year  != now.year ||
              genvex_month != now.month ||
              genvex_date  != now.day_of_month ||
              genvex_day   != expected_day;

          // Compare time-of-day in minutes
          int genvex_minutes = genvex_hour * 60 + genvex_minute;
          int system_minutes = now.hour * 60 + now.minute;

          int minute_diff = abs(genvex_minutes - system_minutes);

          // Handle crossing midnight correctly
          if (minute_diff > 720)
            minute_diff = 1440 - minute_diff;

          ESP_LOGD("genvex_clock",
                   "Clock check: Genvex %02d:%02d, System %02d:%02d, diff %d min",
                   genvex_hour,
                   genvex_minute,
                   now.hour,
                   now.minute,
                   minute_diff);

          if (date_mismatch || minute_diff >= 2) {
            ESP_LOGI("genvex_clock",
                     "Clock mismatch detected - requesting synchronization");

            id(sync_genvex_clock).press();
          }


uart:
  - id: uart_unused
    rx_pin: GPIO4
    tx_pin: GPIO5
    baud_rate: 19200
    data_bits: 8
    parity: NONE
    stop_bits: 1
  - id: uart_genvex
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 19200
    data_bits: 8
    parity: EVEN
    stop_bits: 1

modbus:
    - id: unused_modbus
      uart_id: uart_unused
    - id: genvex_modbus
      uart_id: uart_genvex

modbus_controller:
  id: genvex_modbus_controller
  address: 1
  modbus_id: genvex_modbus
  update_interval: 60s
  command_throttle: 10ms
  
time:
  - platform: homeassistant
    id: homeassistant_time
  - platform: sntp
    id: sntp_time
    timezone: Europe/Copenhagen
    servers:
      - europe.pool.ntp.org

external_components:
  - source:
      type: local
      path: components
    components: [genvexv2]

genvexv2:

select:
  - platform: genvexv2
    modbus_controller_id: genvex_modbus_controller
    name: "Genvex speed mode"
    id: genvex_speed_mode    
    address: 100
    options:
      - "Off"
      - "1"
      - "2"
      - "3"
      - "4"
      
  - platform: genvexv2
    modbus_controller_id: genvex_modbus_controller
    name: "Genvex timer"
    id: genvex_timer    
    address: 106
    options:
      - "Off"
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
      - "9"

button:
  # Create a button on web to reset device
  - platform: restart
    name: "Device Restart"
      
  - platform: template
    name: "Appliance Sync NTP"
    id: sync_genvex_clock
    on_press:
      - if:
          condition:
            lambda: |-
              return id(sntp_time).now().is_valid();
          then:
            # Year
            - modbus_client.write_single_register:
                modbus_id: genvex_modbus
                address: 1
                start_address: 205
                value: !lambda |-
                  return id(sntp_time).now().year - 2000;

            # Month
            - modbus_client.write_single_register:
                modbus_id: genvex_modbus
                address: 1
                start_address: 204
                value: !lambda |-
                  return id(sntp_time).now().month;

            # Date
            - modbus_client.write_single_register:
                modbus_id: genvex_modbus
                address: 1
                start_address: 203
                value: !lambda |-
                  return id(sntp_time).now().day_of_month;

            # Day - Genvex: Monday=1 ... Sunday=7
            - modbus_client.write_single_register:
                modbus_id: genvex_modbus
                address: 1
                start_address: 202
                value: !lambda |-
                  auto now = id(sntp_time).now();

                  // ESPHome: Sunday=1 ... Saturday=7
                  // Genvex:  Monday=1 ... Sunday=7
                  return now.day_of_week == 1 ? 7 : now.day_of_week - 1;

            # Hour
            - modbus_client.write_single_register:
                modbus_id: genvex_modbus
                address: 1
                start_address: 200
                value: !lambda |-
                  return id(sntp_time).now().hour;

            # Minute - deliberately last
            - modbus_client.write_single_register:
                modbus_id: genvex_modbus
                address: 1
                start_address: 201
                value: !lambda |-
                  return id(sntp_time).now().minute;

            - logger.log:
                level: INFO
                format: "Genvex clock synchronized"

          else:
            - logger.log:
                level: WARN
                format: "Genvex clock sync skipped - system time not valid"

sensor:
  - platform: template
    name: "Genvex Efficiency"
    icon: mdi:air-filter
    unit_of_measurement: "%"
    lambda: |-
      const float t1 = id(genvex_temp_t1).state;
      const float t3 = id(genvex_temp_t3).state;
      const float t7 = id(genvex_temp_t7).state;
      const float delta = t7 - t3;
      // A gradient below 1 C is too small for a stable ratio.
      if (!std::isfinite(t1) || !std::isfinite(t3) || !std::isfinite(t7) || fabsf(delta) < 1.0f) {
        return NAN;
      }
      return 100.0f * (t1 - t3) / delta;
    update_interval: 60s
    state_class: measurement
    
  - platform: modbus_controller
    modbus_controller_id: genvex_modbus_controller
    name: "Genvex temp t1"
    id: genvex_temp_t1
    unit_of_measurement: °C
    accuracy_decimals: 1
    device_class: temperature
    value_type: U_WORD
    register_type: read
    address: 0
    lambda: |-
      ESP_LOGD("T1", "Processing T1 using lambda");
      return ((x - 300) / 10);
      
  - platform: modbus_controller
    modbus_controller_id: genvex_modbus_controller
    name: "Genvex temp t3"
    id: genvex_temp_t3
    unit_of_measurement: °C
    accuracy_decimals: 1
    device_class: temperature
    value_type: U_WORD
    register_type: read
    address: 2
    lambda: |-
      ESP_LOGD("T3", "Processing T3 using lambda");
      return ((x - 300) / 10);
      
  - platform: modbus_controller
